# Commodities & Energy (Metals, Cement, Oil & Gas, Power) — KPI/ratio
# vocabulary and qualitative checklist for the Equity Research / Sectoral
# Analyst agents.
# Source: docs/source-material/er-deep-research-prompts.txt, "Commodities & Energy Analyst" section.

sector: commodities_energy
description: >
  Metals, cement, oil & gas, and power. Cost-curve positioning, backward
  integration, and price-taker dynamics dominate; capital allocation
  discipline across the cycle is the key qualitative differentiator.

