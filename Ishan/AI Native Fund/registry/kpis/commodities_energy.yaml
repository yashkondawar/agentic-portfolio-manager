qualitative_checks:
  - global_cost_curve_positioning: "1st quartile vs. 3rd quartile positioning; degree of integration (mine/well to finished product) against volatile intermediate Indian spot markets."
  - cost_structure_moat: "Role of backward integration (captive mines/power) in mitigating dominant cost inputs (energy, coal/power); quantify cost differential vs. peers."
  - capital_allocation_strategy: "Debt reduction vs. growth capex vs. buybacks/dividends during peak cycles."
  - price_taker_dynamics: "Cost-curve management efficiency given price-taker status; spread (realization minus cost) trends."
  - trade_policy_moats: "Sustainability of local moats from trade policy (anti-dumping duty, regulatory hurdles)."
  - ppa_terms: "For power/renewables — average PPA terms and tariff certainty."
  - demand_visibility: "Correlation with government capex / infra spending (e.g., National Infrastructure Pipeline)."
  - cement_regional_pricing: "High freight costs make cement hyper-local; compare regional pricing power among peers."
  - esg_compliance_risk: "Carbon taxes, pollution norms, and potential impact on future cost structures."

cycle_overlap_checks:
  - valuation_earnings_cycle: "Is the valuation premium/discount justified by sustainable ROCE stability, or driven purely by the valuation cycle (Stage 3 euphoria)? Is high P/E from genuine ROCE improvement or valuation-cycle expansion?"
  - credit_capex_cycle: "Assess capex/growth funding needs against the current credit window; quantify resulting FCF constraints and potential debt risk."
  - policy_profit_cycle: "If enjoying a regulatory moat (PLI, indigenization list), assess political risk and sustainability, especially receivable-day exposure to government counterparties."

niche_pointers:
  - city_gas_distribution: "Impact of APM gas allocation (low-cost sourcing) on margins vs. peers reliant on market gas."
  - oil_gas_upstream: "Direct sensitivity of profitability to Brent crude prices and cess/tax regulatory changes."
