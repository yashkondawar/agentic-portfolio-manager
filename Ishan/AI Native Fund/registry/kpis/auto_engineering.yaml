  - name: market_cap
    unit: currency
    category: core_valuation
  - name: enterprise_value
    unit: currency
    category: core_valuation
  - name: pe_ltm
    unit: "x"
    category: core_valuation
  - name: forward_pe
    unit: "x"
    category: core_valuation
  - name: ev_ebitda_ltm
    unit: "x"
    category: core_valuation
  # Core Profitability
  - name: revenue_ltm
    unit: currency
    category: core_profitability
  - name: ebitda_ltm
    unit: currency
    category: core_profitability
  - name: net_profit_excl_oneoffs
    unit: currency
    category: core_profitability
  - name: gross_margin
    unit: "%"
    category: core_profitability
  - name: ebitda_margin
    unit: "%"
    category: core_profitability
  - name: roce
    unit: "%"
    category: core_profitability
  - name: roe
    unit: "%"
    category: core_profitability
  # Efficiency
  - name: capacity_utilization
    unit: "%"
    category: efficiency
  - name: working_capital_days
    unit: days
    category: efficiency
  - name: inventory_days
    unit: days
    category: efficiency
  # Growth
  - name: revenue_growth_rate
    unit: "%"
