# Auto & Engineering (OEMs, CVs, PVs, Ancillaries, Defense) — KPI/ratio
# vocabulary and qualitative checklist for the Equity Research / Sectoral
# Analyst agents.
# Source: docs/source-material/er-deep-research-prompts.txt, "Auto & Engineering Analyst" section.

sector: auto_engineering
description: >
  OEMs (CV/PV/2W), auto ancillaries, and defense engineering. Operating
  leverage, commodity-cost sensitivity, and EV-transition risk/opportunity
  dominate the analytical frame; this is a classically cyclical sector.

