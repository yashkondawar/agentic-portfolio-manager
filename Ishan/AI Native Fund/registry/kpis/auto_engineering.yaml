  # Sector-specific
  - name: cv_volume_growth
    unit: "%"
    category: volume_mix
  - name: pv_volume_growth
    unit: "%"
    category: volume_mix
  - name: exports_pct_of_sales
    unit: "%"
    category: volume_mix
  - name: dealer_inventory_days
    unit: days
    category: volume_mix
  - name: content_per_vehicle_growth
