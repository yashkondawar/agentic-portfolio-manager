    unit: "x"
    category: receivables_debt

qualitative_checks:
  - operating_leverage_moat: "Plant utilization / capacity; break-even point calculation or proxy metrics for key manufacturing peers."
  - commodity_sensitivity: "Ability to manage steel/aluminum commodity cost sensitivity."
  - ev_transition_risk_strategy: "EV transition risk exposure, especially for ICE component makers; contrast with opportunities in wiring harnesses, motors, batteries."
  - defense_regulatory_moats: "Benefit from indigenization list as regulatory moat; risk of high receivable days from Ministry of Defence."
  - macro_linkage: "CV sales/volume as proxy for GDP/freight movement; PV sales linkage to consumer credit access and sentiment."
  - ev_adoption_drivers: "Impact of government subsidies (e.g. FAME scheme) on demand/adoption, especially 2W/3W segments."
  - ev_penetration_sensitivity: "Mandatory — EV penetration sensitivity analysis by segment; long-term impact on revenue mix and cost structure of component suppliers."
  - scrappage_policy: "Impact of global/domestic scrappage policy on replacement-cycle demand."
  - localization: "Impact of component localization policy on input costs and supply chain resilience."

cycle_overlap_checks:
  - valuation_earnings_cycle: "Is the valuation premium/discount justified by sustainable ROCE stability, or driven purely by the valuation cycle (Stage 3 euphoria)? Is high P/E from genuine ROCE improvement or valuation-cycle expansion?"
  - credit_capex_cycle: "Assess capex/growth funding needs against the current credit window; quantify resulting FCF constraints and potential debt risk."
  - policy_profit_cycle: "If enjoying a regulatory moat (PLI, indigenization list), assess political risk and sustainability, especially receivable-day exposure to government counterparties."

niche_pointers:
  - auto_ancillaries: "Content per vehicle (CPV) — is the peer's part worth more in an EV than an ICE vehicle?"
