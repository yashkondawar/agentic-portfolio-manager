# Pharma & Chemicals (Generics, APIs, Specialty Chemicals, CDMO) — KPI/ratio
# vocabulary and qualitative checklist for the Equity Research / Sectoral
# Analyst agents.
# Source: docs/source-material/er-deep-research-prompts.txt, "Pharma & Chemicals Analyst" section.

sector: pharma_chemicals
description: >
  Generics, APIs, specialty chemicals, and CDMO/CRAMS. Regulatory
  compliance (USFDA/DGCI), manufacturing complexity moat, and pipeline
  strength (Paragraph IV filings) dominate the analytical frame.

