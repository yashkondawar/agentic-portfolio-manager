    unit: count
    category: pipeline_regulatory
  - name: paragraph_iv_filings_total_pending
    unit: count
    category: pipeline_regulatory

qualitative_checks:
  - complexity_moat: "Manufacturing process complexity; shift towards complex injectables or biosimilars; CDMO/CRAMS capability."
  - backward_integration_moat: "Level of backward integration into key starting materials (KSM) and APIs; potential PLI-scheme benefit."
  - regulatory_risk_compliance: "Recent USFDA/DGCI warning letters or import alerts for key facilities; quantified revenue/margin impact; management remediation commentary."
  - pipeline_assessment: "Volume and potential of Paragraph IV filings as an indicator of future high-margin generic launches."
  - regulatory_price_cap_exposure: "Percentage of domestic sales subject to NPPA (NLEM) price caps."
  - global_supply_chain_shifts: "Evidence of China+1 policy influencing global innovators shifting CDMO/CRAMS volume or API sourcing."
  - us_price_erosion: "Trends in US price erosion for the generic segment."
  - chronic_therapies: "Key chronic therapies dominating domestic sales and their growth stability."
  - specialty_chemicals_moat: "Active-principles focus and nature of multi-year client validation moats (high switching costs)."

cycle_overlap_checks:
  - valuation_earnings_cycle: "Is the valuation premium/discount justified by sustainable ROCE stability, or driven purely by the valuation cycle (Stage 3 euphoria)? Is high P/E from genuine ROCE improvement or valuation-cycle expansion?"
  - credit_capex_cycle: "Assess capex/growth funding needs against the current credit window; quantify resulting FCF constraints and potential debt risk."
  - policy_profit_cycle: "If enjoying a regulatory moat (PLI, indigenization list), assess political risk and sustainability, especially receivable-day exposure to government counterparties."

niche_pointers:
  - specialty_chemicals: "Revenue stability and margin profile of CDMO/CRAMS segments vs. core generics/branded business."
  - paragraph_iv_track_record: "Peer group's Paragraph IV filing success rate over the last 3-5 years."
