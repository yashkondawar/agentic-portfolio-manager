  # Core Valuation
  - name: market_cap
    unit: currency
    category: core_valuation
  - name: enterprise_value
    unit: currency
    category: core_valuation
  - name: pe_ltm
    unit: "x"
    category: core_valuation
  - name: forward_pe
    unit: "x"
    category: core_valuation
  - name: ev_ebitda_ltm
    unit: "x"
    category: core_valuation
  # Core Profitability
  - name: revenue_ltm
    unit: currency
    category: core_profitability
  - name: ebitda_ltm
    unit: currency
    category: core_profitability
  - name: net_profit_excl_oneoffs
    unit: currency
    category: core_profitability
  - name: gross_margin
    unit: "%"
    category: core_profitability
  - name: ebitda_margin
    unit: "%"
    category: core_profitability
  - name: roce
    unit: "%"
    category: core_profitability
  - name: roe
    unit: "%"
    category: core_profitability
  # Balance Sheet
  - name: net_debt
    unit: currency
    category: balance_sheet
  - name: net_debt_to_ebitda
    unit: "x"
    category: balance_sheet
  - name: rd_spend_pct_sales
    unit: "%"
    category: balance_sheet
  # Growth
  - name: revenue_growth_rate
    unit: "%"
    category: growth
  - name: expected_future_growth_rate
    unit: "%"
    category: growth
  # Cash Flow
  - name: operating_cashflow
    unit: currency
    category: cash_flow
  - name: capex
    unit: currency
    category: cash_flow
  - name: fcf_post_dividend_acquisitions
    unit: currency
    category: cash_flow
  - name: fcf_yield
    unit: "%"
    category: cash_flow
  # Sector-specific
  - name: us_generics_revenue_pct
    unit: "%"
    category: segment_mix
  - name: cdmo_crams_revenue_pct
    unit: "%"
    category: segment_mix
  - name: domestic_formulations_revenue_pct
    unit: "%"
    category: segment_mix
  - name: specialty_chemicals_revenue_pct
    unit: "%"
    category: segment_mix
  - name: api_ksm_integration_pct
    unit: "%"
    category: operational_moats
  - name: rd_intensity
    unit: "%"
    category: operational_moats
