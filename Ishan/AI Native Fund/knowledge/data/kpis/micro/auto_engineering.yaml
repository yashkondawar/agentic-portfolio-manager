# Auto & Engineering micro KPI deep-definitions. Lean by design: formula +
# sourcing + xref only. Qualitative framing lives in
# registry/kpis/auto_engineering.yaml and knowledge/references/sectors/
# auto_engineering.md — not repeated here.
sector: auto_engineering
registry_ref: registry/kpis/auto_engineering.yaml
kpis:
  - kpi_id: auto_ev_ebitda_ltm
    scope: sector
    cycle_refs: [valuation_cycle, sector_thematic_cycle]
    formula: "EV/EBITDA (LTM) = Enterprise Value / Trailing 12M EBITDA"
    inputs:
      - name: Enterprise value, trailing EBITDA
        source: afund.daily_prices (mcap proxy) + afund.financials_quarterly (ebitda)
        status: derivable
    orientation: value_type
    lookback_years: 8
    cadence: daily
    source_status: derivable
    registry_xref: "kpis/auto_engineering.yaml#ev_ebitda_ltm"
    references_xref: [sectors/auto_engineering.md, kpi_interpretation/valuation_cycle.md]

  - kpi_id: auto_capacity_utilization
    scope: sector
    cycle_refs: [capex_investment_cycle, gdp_business_cycle]
    formula: "Capacity Utilization = Actual Production Volume / Installed Capacity"
    inputs:
      - name: Production volume, installed capacity
        source: SIAM monthly data / company disclosures — not yet wired
        status: missing
    orientation: goldilocks_type
    lookback_years: 8
    cadence: quarterly
    source_status: missing
    registry_xref: "kpis/auto_engineering.yaml#capacity_utilization"
    references_xref: [sectors/auto_engineering.md]

  - kpi_id: auto_volume_growth_yoy_by_segment
    scope: sector
    cycle_refs: [gdp_business_cycle, sector_thematic_cycle]
    formula: "Volume Growth YoY (by segment) = YoY % change in units sold, split by CV/PV/2W"
    inputs:
      - name: Monthly unit sales by segment
        source: SIAM monthly dispatch data — not yet wired
        status: missing
    orientation: value_type
    lookback_years: 10
    cadence: monthly
    source_status: missing
    registry_xref: "kpis/auto_engineering.yaml#volume_growth_yoy_by_segment"
    references_xref: [sectors/auto_engineering.md]

  - kpi_id: auto_revenue_from_ev_components_pct
    scope: sector
    cycle_refs: [sector_thematic_cycle]
    formula: "EV Components Revenue % = Revenue from EV-linked components or vehicles / Total Revenue"
    inputs:
      - name: Segment revenue disclosure
        source: company investor presentations — not yet wired
        status: missing
    orientation: value_type
    lookback_years: 5
    cadence: quarterly
    source_status: missing
    registry_xref: "kpis/auto_engineering.yaml#revenue_from_ev_components_pct"
    references_xref: [sectors/auto_engineering.md]
