# Consumer & Retail micro KPI deep-definitions. Lean by design: formula +
# sourcing + xref only. Qualitative framing lives in
# registry/kpis/consumer_retail.yaml and knowledge/references/sectors/
# consumer_retail.md — not repeated here.
sector: consumer_retail
registry_ref: registry/kpis/consumer_retail.yaml
kpis:
  - kpi_id: consumer_ev_ebitda_ltm
    scope: sector
    cycle_refs: [valuation_cycle, sector_thematic_cycle]
    formula: "EV/EBITDA (LTM) = Enterprise Value / Trailing 12M EBITDA"
    inputs:
      - name: Enterprise value, trailing EBITDA
        source: afund.daily_prices (mcap proxy) + afund.financials_quarterly (ebitda)
        status: derivable
    orientation: value_type
    lookback_years: 8
    cadence: daily
    source_status: derivable
    registry_xref: "kpis/consumer_retail.yaml#ev_ebitda_ltm"
    references_xref: [sectors/consumer_retail.md, kpi_interpretation/valuation_cycle.md]

  - kpi_id: consumer_same_store_sales_growth
    scope: sector
    cycle_refs: [gdp_business_cycle, sector_thematic_cycle]
    formula: "Same-Store Sales Growth (SSSG) = YoY revenue growth for stores open >12 months, isolating organic demand from new-store expansion"
    inputs:
      - name: Store-level revenue by vintage
        source: company investor presentations — not yet wired
        status: missing
    orientation: value_type
    lookback_years: 8
    cadence: quarterly
    source_status: missing
    registry_xref: "kpis/consumer_retail.yaml#same_store_sales_growth"
    references_xref: [sectors/consumer_retail.md]

  - kpi_id: consumer_ad_promo_spend_pct_of_sales
    scope: sector
    cycle_refs: [earnings_margin_cycle]
    formula: "Ad & Promo Spend % of Sales = Advertising & Promotion Expense / Revenue"
    inputs:
      - name: A&P expense, revenue
        source: afund.financials_quarterly.raw_json (A&P line not a dedicated column) + revenue
        status: derivable
    orientation: goldilocks_type
    lookback_years: 8
    cadence: quarterly
    source_status: derivable
    registry_xref: "kpis/consumer_retail.yaml#ad_promo_spend_pct_of_sales"
    references_xref: [sectors/consumer_retail.md]

  - kpi_id: consumer_volume_growth
    scope: sector
    cycle_refs: [gdp_business_cycle]
    formula: "Volume Growth = YoY % change in units sold, decomposed from reported value growth net of price/mix"
    inputs:
      - name: Reported value growth, price/mix commentary
        source: company investor presentations — not yet wired
        status: missing
    orientation: value_type
    lookback_years: 8
    cadence: quarterly
    source_status: missing
    registry_xref: "kpis/consumer_retail.yaml#volume_growth"
    references_xref: [sectors/consumer_retail.md]
