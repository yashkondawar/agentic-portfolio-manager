# Infrastructure & Capital Goods micro KPI deep-definitions. Lean by
# design: formula + sourcing + xref only. Qualitative framing lives in
# registry/kpis/infra_capital_goods.yaml and knowledge/references/sectors/
# infra_capital_goods.md — not repeated here.
sector: infra_capital_goods
registry_ref: registry/kpis/infra_capital_goods.yaml
kpis:
  - kpi_id: infra_ev_ebitda_ltm
    scope: sector
    cycle_refs: [valuation_cycle, capex_investment_cycle, sector_thematic_cycle]
    formula: "EV/EBITDA (LTM) = Enterprise Value / Trailing 12M EBITDA"
    inputs:
      - name: Enterprise value, trailing EBITDA
        source: afund.daily_prices (mcap proxy) + afund.financials_quarterly (ebitda)
        status: derivable
    orientation: value_type
    lookback_years: 8
    cadence: daily
    source_status: derivable
    registry_xref: "kpis/infra_capital_goods.yaml#ev_ebitda_ltm"
    references_xref: [sectors/infra_capital_goods.md, kpi_interpretation/valuation_cycle.md]

  - kpi_id: infra_order_book_growth_yoy
    scope: sector
    cycle_refs: [capex_investment_cycle]
    formula: "Order Book Growth YoY = YoY % change in disclosed unexecuted order book value"
    inputs:
      - name: Quarterly order-book disclosure
        source: company investor presentations — not yet wired
        status: missing
    orientation: value_type
    lookback_years: 8
    cadence: quarterly
    source_status: missing
    registry_xref: "kpis/infra_capital_goods.yaml#order_book_growth_yoy"
    references_xref: [sectors/infra_capital_goods.md]

  - kpi_id: infra_order_book_to_bill_ratio
    scope: sector
    cycle_refs: [capex_investment_cycle]
    formula: "Order Book-to-Bill Ratio = Unexecuted Order Book / Trailing 12M Revenue — a forward revenue-visibility measure"
    inputs:
      - name: Order book, trailing revenue
        source: company disclosures + afund.financials_quarterly (revenue)
        status: derivable
    orientation: value_type
    lookback_years: 8
    cadence: quarterly
    source_status: derivable
    registry_xref: "kpis/infra_capital_goods.yaml#order_book_to_bill_ratio"
    references_xref: [sectors/infra_capital_goods.md]

  - kpi_id: infra_receivable_days
    scope: sector
    cycle_refs: [credit_debt_cycle]
    formula: "Receivable Days = (Trade Receivables / Revenue) x 365 — working-capital stress indicator, esp. government-counterparty exposure"
    inputs:
      - name: Trade receivables
        source: afund.financials_quarterly.raw_json (balance-sheet detail not a dedicated column)
        status: derivable
      - name: Revenue
        source: afund.financials_quarterly (revenue)
        status: available
    orientation: fear_type
    lookback_years: 8
    cadence: quarterly
    source_status: derivable
    registry_xref: "kpis/infra_capital_goods.yaml#receivable_days"
    references_xref: [sectors/infra_capital_goods.md]
