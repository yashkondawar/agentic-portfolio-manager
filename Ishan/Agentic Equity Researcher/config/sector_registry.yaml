# Sector registry — THE single source of truth for sector routing.
#
# Before this file existed, the 8 valid sector slugs were duplicated by hand in four
# places (prompts/02_triage_rules.md T2, config/agent_config.yaml's comment, README.md,
# CLAUDE.md) with nothing keeping them in sync, and schema/valuation_handoff.schema.json
# typed `sector_pack` as a bare string with no enum — so a typo'd or invented pack name
# validated cleanly and silently.
#
# Consumers:
#   prompts/02_triage_rules.md          T2 classification (family + playbook + confidence)
#   prompts/03_business_model_...       KPI-tree seeding from signature_kpis
#   tools/compute_kpis.py               --playbook: signature_kpis coverage check
#   tools/compute_ratios.py             --family: skip_ratios suppression
#   tools/validate_sector_registry.py   integrity check — run after ANY edit
#   schema/valuation_handoff.schema.json  enum kept in sync with families
#
# TWO TIERS:
#   families  — 8 broad routing packs (prompts/sector_packs/<slug>.md). Coarse, stable;
#               `sector_pack` in the handoff still records one of these.
#   playbooks — deep sub-sector playbooks (prompts/sector_playbooks/<slug>.md). A family
#               answers "which statements, which lenses"; a playbook answers "what exactly
#               do I compute, in what order, and what does good look like".
#
# KEYWORD PRECISION WARNING (learned the hard way in tools/er_corpus/fetch_corpus.py):
# an early sector classifier used the bare token `APE` for BFSI's annualised premium
# equivalent. It matched "ape" and "apex" 44 times inside a transmission-conductor note
# and routed a capital-goods company to BFSI. NEVER use a bare 2-4 letter acronym as a
# keyword. Prefer multi-word phrases that occur in essentially one sector.
#
# `status: authored` = the playbook file exists. `status: pending` = the routing entry is
# live (so triage degrades to the family pack, not to `generic`) but the deep playbook is
# not yet written. validate_sector_registry.py reports pending entries as INFO, and errors
# only when an `authored` entry has no file.
#
# ALL 32 PLAYBOOKS ARE `authored` as of 2026-08-03. `pending` remains a valid status for
# future additions; no entry currently uses it.
#
# WHAT THIS FILE DOES *NOT* CARRY — one fact, one home:
#   valuation convention  -> `prompts/sector_playbooks/<slug>.md`, section
#                            "## Valuation convention" (with its traps, and the corpus
#                            note it is anchored to). Until 2026-08-03 this file also
#                            carried a one-line prose summary per playbook; that made the
#                            registry a second, shorter, drifting copy of the playbook's
#                            own section, so it was removed. E11 in
#                            validate_sector_registry.py fails the build if it comes back.
#   analysis sequence, exhibit set, forensic screens -> the playbook file, same reason.
# What stays here is only what a MACHINE routes or checks on: family, status, keywords,
# signature_kpis (the coverage contract tools/compute_kpis.py enforces),
# unit_denominator, and the interpretation frame (primary_multiple,
# secondary_multiples, multiple_conditioners).
#
# THE INTERPRETATION FRAME (added 2026-08-11) — and why it is not an E11 violation.
# docs/OPINION_VS_ANALYSIS.md section 7 says a reading is `fact + conditioning variable +
# sector convention -> verdict`. The *convention prose* stays in the playbook, where E11
# put it. What lives here is only the machine form a tool can route on: which multiple is
# primary, which are secondary cross-checks, and which conditioning variables decide the
# reading in this sub-sector. Three tokens, no sentences. `multiple_conditioners` draws
# from the closed vocabulary below — E12 requires an authored playbook to declare a
# primary_multiple and at least one conditioner, E13 rejects a token outside the
# vocabulary. Downstream: prompts/33 seeds state/interpretation_ledger.json from it, and
# the fund repo's src/afund/research/er_adapter.py reads it into the buy-side packet.

version: 1
updated: "2026-08-11"
derived_from: docs/ER_CORPUS_FINDINGS.md

# The closed vocabularies the interpretation frame draws on. Closed so that readings are
# comparable across notes and machine-checkable; the prose definitions, with the question
# each conditioner answers, are docs/OPINION_VS_ANALYSIS.md section 7.4.
interpretation_vocabulary:
  conditioning_variables:
    - growth_rate              # is the multiple justified by the LEVEL of growth (PEG)?
    - growth_durability        # for how many years must it hold, and has it ever?
    - incremental_roce         # what does the MARGINAL rupee of capital earn?
    - sustainable_roe          # what through-cycle return does a P/B or P/ABV capitalise?
    - cycle_position           # trough, mid-cycle or peak earnings base?
    - earnings_base_quality    # adjusted vs reported, attributable vs headline, one-offs
    - capital_intensity        # asset-heavy or asset-light; what does replacement cost say?
    - terminal_value_share     # how much value sits beyond the forecast horizon?
    - balance_sheet_risk       # does leverage, funding cost or covenant change the verdict?
    - accounting_basis         # Ind-AS 116, standalone vs consolidated, fiscal-base mismatch
    - own_history_anchor       # how is this priced against its own multiple band?
    - peer_set_choice          # which comparables define "the peers", and who chose them?
  multiples:
    - pe_forward
    - pe_midcycle
    - pe_executed_earnings     # order book converted at a historical execution rate first
    - pe_core_adjusted         # "core" EPS — the adjustment list must be published
    - peg
    - ev_ebitda_forward
    - ev_ebitda_midcycle
    - ev_ebitda_runrate
    - ev_sales
    - ev_gmv
    - ev_pre_sales
    - ev_per_tonne
    - ev_per_key
    - ev_per_bed
    - ev_per_scm
    - p_abv                    # adjusted book value — nets off net NPAs
    - p_b
    - p_bv_regulated           # regulated equity base, not reported book
    - p_ev                     # embedded value (life insurance only)
    - appraisal_value          # EV + n x VNB
    - pct_of_aaum
    - dcf
    - sotp
    - nav_gav
    - cap_rate
    - replacement_cost

families:
  bfsi:
    display: "Banking, Financial Services & Insurance"
    pack: prompts/sector_packs/bfsi.md
    bfsi_statements: true
    skip_ratios: [inventory_days, receivable_days, payable_days, cash_conversion_cycle,
                  ebitda_margin, ev_ebitda, asset_turnover]
    primary_multiple: p_b
    secondary_multiples: [p_abv, p_ev, pe_forward]
    multiple_conditioners: [sustainable_roe, balance_sheet_risk, earnings_base_quality]
  consumer_retail:
    display: "Consumer, Retail & Hospitality"
    pack: prompts/sector_packs/consumer_retail.md
    bfsi_statements: false
    primary_multiple: pe_forward
    secondary_multiples: [ev_ebitda_forward, dcf]
    multiple_conditioners: [growth_durability, incremental_roce, accounting_basis]
